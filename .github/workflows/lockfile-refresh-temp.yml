name: Refresh patched Next.js lockfile (temporary)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: lockfile-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate PR merge tree
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve patched Next.js and regenerate lockfile
        run: |
          npm pkg set 'dependencies.next=^16.4.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile consistency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload generated dependency files for review
        uses: actions/upload-artifact@v4
        with:
          name: patched-next-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
