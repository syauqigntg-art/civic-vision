name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "phase3/**"
      - "phase4/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Install and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: PBL validation and answer-helper unit tests
        run: npm run test:unit

      - name: Patch whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: PBL and security regression invariants
        run: node scripts/check-pbl-invariants.mjs

      - name: Next.js production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://civic-vision-ci.invalid.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-placeholder-anon-key-000000
          SUPABASE_SERVICE_ROLE_KEY: ci-build-only-placeholder-service-key-000000
        run: npm run build

      - name: Report production dependency advisories
        # Production dependency vulnerabilities must block CI until fixed.
        run: npm audit --omit=dev

      - name: Report full dependency-tree advisories (triage)
        # Report-only while Stage 4 reviews the development/transitive advisories.
        # Production dependency vulnerabilities remain blocking in the step above.
        run: |
          npm audit --json > /tmp/npm-audit-full.json || true
          node scripts/report-full-dependency-audit.mjs /tmp/npm-audit-full.json
