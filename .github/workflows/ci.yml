name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Install and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
      
      - name: PBL and security regression invariants
        run: node scripts/check-pbl-invariants.mjs

      - name: Report production dependency advisories
        # Production dependency vulnerabilities must block CI until fixed.
        run: npm audit --omit=dev
