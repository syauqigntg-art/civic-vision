name: CI

on:
  pull_request:
    branches:
      - main
      - "phase3/**"
      - "phase4/**"
      - "phase5/**"
  push:
    branches:
      - main
      - "phase3/**"
      - "phase4/**"
      - "phase5/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-hard-delete-regression:
    name: PostgreSQL hard-delete regression (pre-versioning schema)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install PostgreSQL on the runner (no Docker)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql postgresql-client
          sudo service postgresql start
          pg_lsclusters
          pg_isready

      - name: Create disposable local database and record runtime version
        run: |
          set -euo pipefail
          psql --version
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -f supabase/tests/bootstrap-local-roles.sql
          sudo -u postgres createdb --owner=postgres civic_vision_test
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d civic_vision_test -f supabase/tests/bootstrap-local-supabase.sql
          echo "::group::PostgreSQL server version"
          sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d civic_vision_test -c "SHOW server_version;"
          echo "::endgroup::"

      - name: Build baseline through migration 20261023010223
        run: |
          set -euo pipefail
          for sql in \
            supabase/schema.sql \
            supabase/p1-project-isolation.sql \
            supabase/migrations/20261022151155_harden_is_admin_and_fk_indexes.sql \
            supabase/migrations/20261022151421_optimize_users_rls_policies.sql \
            supabase/migrations/20261022152719_secure_admin_helper_and_transactional_question_editor.sql \
            supabase/migrations/20261022153005_add_safe_question_deletion_rpc.sql \
            supabase/migrations/20261022153051_add_transactional_question_order_and_delete.sql \
            supabase/migrations/20261023010223_serialize_answer_saves_with_submission.sql
          do
            echo "::group::Apply $sql"
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d civic_vision_test -f "$sql"
            echo "::endgroup::"
          done
          echo "::group::Grant Supabase-like table access for local test roles"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d civic_vision_test -c "GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;"
          echo "::endgroup::"

      - name: Apply existing corrective migration to disposable database
        run: |
          set -euo pipefail
          echo "::group::Apply supabase/migrations/20261027230000_admin_question_hard_delete_archive_guard.sql"
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d civic_vision_test -f supabase/migrations/20261027230000_admin_question_hard_delete_archive_guard.sql
          echo "::endgroup::"

      - name: Run synthetic pre-versioning regression suite
        run: |
          set -euo pipefail
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d civic_vision_test -f supabase/tests/admin-question-hard-delete-no-versioning.sql

  typecheck:
    name: Install and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: PBL and admin copy/accessibility regression tests
        run: npm run test:unit

      - name: Patch whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: PBL and security regression invariants
        run: node scripts/check-pbl-invariants.mjs

      - name: Next.js production build (without Supabase runtime configuration)
        run: |
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          npm run build

      - name: Runtime smoke tests without Supabase runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          unset NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY
          npm run start -- --hostname 127.0.0.1 > /tmp/civic-vision-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/ -o /tmp/civic-vision-home.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -q "Layanan backend belum dikonfigurasi" /tmp/civic-vision-home.html

          login_status=$(curl --silent --show-error -o /tmp/civic-vision-login.html -w '%{http_code}' http://127.0.0.1:3000/admin/login)
          test "$login_status" = "200"
          grep -q "Login guru" /tmp/civic-vision-login.html
          grep -q "Layanan backend belum dikonfigurasi" /tmp/civic-vision-login.html

          admin_status=$(curl --silent --show-error -D /tmp/civic-vision-admin.headers -o /tmp/civic-vision-admin.body -w '%{http_code}' http://127.0.0.1:3000/admin/questions)
          test "$admin_status" = "307"
          grep -qi 'location: .*admin/login?config=unavailable' /tmp/civic-vision-admin.headers

          api_status=$(curl --silent --show-error -o /tmp/civic-vision-api.json -w '%{http_code}' -X POST http://127.0.0.1:3000/api/student-content -H 'content-type: application/json' --data '{"op":"list_videos","args":{"code":"NOTREAL"}}')
          test "$api_status" = "503"
          grep -q "Layanan backend belum dikonfigurasi" /tmp/civic-vision-api.json

      - name: Report production dependency advisories
        # Production dependency vulnerabilities must block CI until fixed.
        run: npm audit --omit=dev

      - name: Report full dependency-tree advisories (triage)
        # Report-only while Stage 4 reviews the development/transitive advisories.
        # Production dependency vulnerabilities remain blocking in the step above.
        run: |
          npm audit --json > /tmp/npm-audit-full.json || true
          node scripts/report-full-dependency-audit.mjs /tmp/npm-audit-full.json
