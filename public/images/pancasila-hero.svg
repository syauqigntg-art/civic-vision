 <path d="M385 506h134v15H385z" fill="#AFC5DD" stroke="#F8FBFF" stroke-width="3"/>
</g>
<!-- Flag of Indonesia: plain red upper half, white lower half -->
<g filter="url(#shadow)">
 <path d="M614 176v236" stroke="#F6FAFE" stroke-width="7" stroke-linecap="round"/>
 <path d="M621 184h174v58H621z" fill="url(#red)"/>
 <path d="M621 242h174v58H621z" fill="#FFFFFF"/>
 <path d="M621 184h174v116H621" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="2"/>
</g>
<path d="M116 540c135-42 249-39 355-8 104 30 207 25 320-14" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="3" stroke-linecap="round"/>
<path d="M164 561c113-27 204-21 290 3 85 24 176 20 273-8" stroke="#D8EAF9" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
</svg>