<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Monumen Nasional dan bendera Indonesia</title>
<desc id="desc">Ilustrasi Monas, bendera Merah Putih dengan warna merah di atas putih, dan gugusan pulau Indonesia.</desc>
<defs>
 <linearGradient id="glass" x1="145" y1="45" x2="760" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FCFF" stop-opacity=".82"/><stop offset="1" stop-color="#B7D3EF" stop-opacity=".18"/></linearGradient>
 <linearGradient id="stone" x1="385" y1="155" x2="520" y2="530" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#B5CDE5"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F35B65"/><stop offset="1" stop-color="#D52F43"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#092B58" flood-opacity=".2"/></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<circle cx="466" cy="296" r="235" fill="#EAF5FF" fill-opacity=".32" filter="url(#blur)"/>
<circle cx="466" cy="296" r="214" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".48" stroke-width="2"/>
<!-- Simplified Indonesian archipelago motif -->
<g fill="#EAF4FC" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="3" stroke-linejoin="round">
 <path d="m118 408 26-16 31 5 16 17-21 15-34-4-18-17Z"/>
 <path d="m218 385 27-11 29 8 17 17-21 14-33-5-19-23Z"/>
 <path d="m316 402 27-14 32 9 15 19-23 13-33-8-18-19Z"/>
 <path d="m420 391 26-12 29 8 15 17-20 15-34-6-16-22Z"/>
 <path d="m520 403 27-14 31 9 15 18-23 13-33-8-17-18Z"/>
 <path d="m626 390 25-11 29 9 14 17-20 14-32-6-16-23Z"/>
 <path d="m715 414 20-10 22 8 9 14-17 10-24-5-10-17Z"/>
</g>
<!-- Monas -->
<g filter="url(#shadow)">
 <path d="M424 193c0-18 13-33 28-33s28 15 28 33l-9 31h-38l-9-31Z" fill="#E8C58B"/>
 <path d="M437 224h30l29 245h-88l29-245Z" fill="url(#stone)" stroke="#FFFFFF" stroke-width="3"/>
 <path d="M423 322h58l5 28h-68l5-28Z" fill="#D8E5F2"/>
