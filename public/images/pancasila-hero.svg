<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Monumen Nasional dan bendera Indonesia</title>
  <desc id="desc">Ilustrasi minimalis Monas, bendera Merah Putih tanpa ornamen, dan kepulauan Indonesia.</desc>
  <defs>
    <linearGradient id="plate" x1="110" y1="60" x2="780" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF3FC" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8EAFD2" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="monas" x1="350" y1="160" x2="505" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#A9C1DC"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F45B64"/>
      <stop offset="1" stop-color="#C92F42"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEF6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071A35" flood-opacity=".22"/>
    </filter>
    <filter id="soft-blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <circle cx="470" cy="300" r="235" fill="#DCEBFA" fill-opacity=".22" filter="url(#soft-blur)"/>
  <circle cx="470" cy="300" r="205" fill="url(#plate)" stroke="#FFFFFF" stroke-opacity=".34"/>

  <!-- Indonesian archipelago, simplified as a quiet geographic motif. -->
  <g fill="#D7E7F4" fill-opacity=".72" stroke="#F7FBFF" stroke-opacity=".72" stroke-width="3" stroke-linejoin="round">
    <path d="M135 411l25-15 26 5 13 15-19 13-31-3-14-15Z"/>
    <path d="M231 389l24-10 25 7 13 16-18 12-29-4-15-21Z"/>
    <path d="M318 401l25-13 29 8 13 18-22 12-30-7-15-18Z"/>
    <path d="M423 393l24-11 26 7 13 16-19 13-29-5-15-20Z"/>
    <path d="M523 403l25-13 28 8 13 17-22 12-29-7-15-17Z"/>
    <path d="M634 392l23-10 25 8 12 16-18 12-28-5-14-21Z"/>
    <path d="M716 414l19-9 21 7 9 13-16 10-23-4-10-17Z"/>
  </g>

  <!-- Monas: obelisk, observation deck, and flame. -->
  <g filter="url(#soft-shadow)">
    <path d="M428 210c0-16 10-29 22-29s22 13 22 29l-8 28h-28l-8-28Z" fill="#E6C58D"/>
    <path d="M435 238h30l28 232H407l28-232Z" fill="url(#monas)" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="3"/>
    <path d="M423 321h54l5 28h-64l5-28Z" fill="#D5E2F0"/>
    <path d="M414 457h72l12 31H402l12-31Z" fill="#AFC4DC" stroke="#F8FBFF" stroke-width="3"/>
    <path d="M392 488h116v17H392z" fill="#E8F0F8" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M381 505h138v15H381z" fill="#9FB8D3" stroke="#F5F9FE" stroke-width="3"/>
  </g>

  <!-- Indonesian flag: red over white, plain and without symbols. -->
  <g filter="url(#soft-shadow)">
    <path d="M605 174v234" stroke="#F4F8FD" stroke-width="7" stroke-linecap="round"/>
    <path d="M612 184h174v58H612z" fill="url(#red)"/>
    <path d="M612 242h174v58H612z" fill="url(#white)"/>
    <path d="M612 184h174v116H612" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2"/>
    <path d="M599 408h26" stroke="#EAF2FB" stroke-width="8" stroke-linecap="round"/>
  </g>

  <path d="M118 536c135-43 245-38 350-8 102 29 206 26 318-13" stroke="#F5F9FF" stroke-opacity=".58" stroke-width="3" stroke-linecap="round"/>
  <path d="M166 559c112-27 202-21 288 3 85 24 175 20 272-8" stroke="#C8DDF2" stroke-opacity=".62" stroke-width="2" stroke-linecap="round"/>
</svg>